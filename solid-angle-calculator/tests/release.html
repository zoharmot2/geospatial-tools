<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v1.0 Release Tests</title><style>body{margin:0;padding:32px;font-family:system-ui,sans-serif;background:#f5f7f8;color:#172126}main{max-width:900px;margin:auto}.summary,.test{background:#fff;border:1px solid #d7dfe3;border-radius:10px;padding:14px 16px;margin-bottom:10px}.pass{border-left:5px solid #27854a}.fail{border-left:5px solid #b42318}.test strong{display:block}.test small{display:block;margin-top:6px;color:#6b7280}</style></head><body><main><h1>Solid Angle Calculator v1.0 Release Tests</h1><div id="summary" class="summary">Running…</div><div id="results"></div></main><script type="module">import{runCoreTests}from'./core-tests.js?v=1.0.0';import{runSpatialTests}from'./spatial-tests.js?v=1.0.0';import{runStateTests}from'./state-tests.js?v=1.0.0';const results=[...(await runCoreTests()),...(await runSpatialTests()),...(await runStateTests())];const passed=results.filter(r=>r.passed).length;document.getElementById('summary').innerHTML=`<strong>${passed}/${results.length} tests passed</strong>${passed===results.length?' — Release test suite is green.':` — ${results.length-passed} failed.`}`;const c=document.getElementById('results');for(const r of results){const e=document.createElement('div');e.className=`test ${r.passed?'pass':'fail'}`;e.innerHTML=r.passed?`<strong>PASS — ${r.name}</strong>`:`<strong>FAIL — ${r.name}</strong><small>${r.error}</small>`;c.appendChild(e);}</script></body></html>
