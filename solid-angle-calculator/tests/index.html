<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solid Angle Calculator — Core Tests</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      font-family: system-ui, sans-serif;
      background: #f5f7f8;
      color: #172126;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
    }
    .summary,
    .test {
      background: #fff;
      border: 1px solid #d7dfe3;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .pass { border-left: 5px solid #27854a; }
    .fail { border-left: 5px solid #b42318; }
    .test strong { display: block; }
    .test small { display: block; margin-top: 6px; color: #6b7280; }
  </style>
</head>
<body>
  <main>
    <h1>Mathematical Core Tests</h1>
    <div id="summary" class="summary">Running tests…</div>
    <div id="results"></div>
  </main>

  <script type="module">
    import { runCoreTests } from "./core-tests.js?v=1.0.0";

    const results = await runCoreTests();
    const passed = results.filter((result) => result.passed).length;
    const failed = results.length - passed;

    document.getElementById("summary").innerHTML =
      `<strong>${passed}/${results.length} tests passed</strong>` +
      (failed === 0 ? " — Mathematical core is green." : ` — ${failed} test(s) failed.`);

    const container = document.getElementById("results");

    for (const result of results) {
      const item = document.createElement("div");
      item.className = `test ${result.passed ? "pass" : "fail"}`;
      item.innerHTML = result.passed
        ? `<strong>PASS — ${result.name}</strong>`
        : `<strong>FAIL — ${result.name}</strong><small>${result.error}</small>`;
      container.appendChild(item);
    }
  </script>
</body>
</html>
